<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA VOICE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f2fb; --surface:#ffffff; --soft:#ebe9fa; --line:#dcdaf0;
  --text:#1a1840; --muted:#5d5a8a; --accent:#4c3fd1; --on-accent:#ffffff;
  --o1:#3fc8b0; --o2:#6a5be0; --o3:#ff8f66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1224; --surface:#181c36; --soft:#222849; --line:#2c3260;
    --text:#eef0ff; --muted:#9aa3d0; --accent:#6ee7d0; --on-accent:#0f1224;
    --o1:#6ee7d0; --o2:#7c6cf0; --o3:#ff9d7a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1224; --surface:#181c36; --soft:#222849; --line:#2c3260;
  --text:#eef0ff; --muted:#9aa3d0; --accent:#6ee7d0; --on-accent:#0f1224;
  --o1:#6ee7d0; --o2:#7c6cf0; --o3:#ff9d7a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font:400 16px/1.5 'DM Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font:800 30px/1 'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif;letter-spacing:-0.03em}
.brand span{color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.pill:hover{background:var(--soft)}
main{display:grid;gap:20px;margin-top:18px}
@media (min-width:900px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
#orbBtn{width:min(78vw,380px);aspect-ratio:1;border:0;background:transparent;padding:0;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#orb{width:100%;height:100%;display:block}
.status{margin:0;font:700 22px/1.2 'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif}
.live{min-height:52px;margin:0;text-align:center;color:var(--muted);max-width:44ch}
.say{display:flex;gap:8px;width:100%;max-width:460px}
.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.say button{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}
.dash{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 10px;font:700 17px/1.2 'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif}
.clock .time{font:800 46px/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-0.03em}
.clock .date{color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
.chips button:hover{border-color:var(--accent)}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:8px 12px}
.row .cnt{font-variant-numeric:tabular-nums;font-weight:700}
.row button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.row button:hover{color:var(--text)}
.empty{color:var(--muted);margin:0;font-size:14px}
#log{max-height:280px;overflow-y:auto;display:grid;gap:8px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:15px;overflow-wrap:anywhere}
.msg.you{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.nova{justify-self:start;background:var(--soft);border-bottom-left-radius:4px}
.msg a{color:inherit;font-weight:600;display:block;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>NOVA</h1><span data-i="tag">Voice assistant</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEn" type="button" aria-pressed="true">English</button>
        <button id="langHi" type="button" aria-pressed="false">हिन्दी</button>
      </div>
      <button id="soundBtn" class="pill" type="button" aria-pressed="true"></button>
      <button id="themeBtn" class="pill" type="button"></button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Nova">
      <button id="orbBtn" type="button" aria-label="Talk to Nova"><canvas id="orb"></canvas></button>
      <p id="status" class="status" aria-live="polite"></p>
      <p id="live" class="live"></p>
      <form id="typeForm" class="say" autocomplete="off">
        <input id="typeInput" type="text" aria-label="Type a command">
        <button id="sendBtn" type="submit"></button>
      </form>
    </section>

    <section class="dash" aria-label="Dashboard">
      <div class="card clock">
        <h2 data-i="now">Now</h2>
        <div id="clockTime" class="time">--:--</div>
        <div id="clockDate" class="date"></div>
      </div>
      <div class="card">
        <h2 data-i="try">Try saying</h2>
        <div id="chips" class="chips"></div>
      </div>
      <div class="card">
        <h2 data-i="timers">Timers</h2>
        <ul id="timerList" class="plain"></ul>
      </div>
      <div class="card">
        <h2 data-i="notes">Notes</h2>
        <ul id="noteList" class="plain"></ul>
      </div>
      <div class="card">
        <h2 data-i="convo">Conversation</h2>
        <div id="log" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function el(tag, props, kids){
  var n = document.createElement(tag);
  if(props){ for(var k in props){ if(k === 'text') n.textContent = props[k]; else n.setAttribute(k, props[k]); } }
  (kids || []).forEach(function(c){ n.appendChild(c); });
  return n;
}

/* ---------- state ---------- */
var lang = store.get('nova:lang', 'en');
var themeSetting = store.get('nova:theme', 'auto');
var soundOn = store.get('nova:sound', true);
var notes = store.get('nova:notes', []);
if(!Array.isArray(notes)) notes = [];
var timers = [];
var timerSeq = 0;
var logItems = [];
var state = 'idle';

function t(en, hi){ return lang === 'hi' ? hi : en; }

/* ---------- UI strings ---------- */
var UI = {
  en: {
    tag:'Voice assistant', now:'Now', 'try':'Try saying', timers:'Timers', notes:'Notes', convo:'Conversation',
    idle:'Tap the orb and speak', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking…',
    placeholder:'Or type a command', send:'Send',
    noTimers:'No timers running. Say “timer 2 minutes”.',
    noNotes:'No notes yet. Say “note buy milk”.',
    noLog:'Your conversation with Nova shows up here.',
    unsupported:'This browser can’t listen. Use Chrome, or type below.',
    blocked:'Microphone is blocked. Allow it in your browser’s site settings.',
    nospeech:'I didn’t hear anything. Tap the orb and try again.',
    soundOn:'Voice: on', soundOff:'Voice: off',
    themeAuto:'Theme: auto', themeLight:'Theme: light', themeDark:'Theme: dark',
    remove:'Remove', cancel:'Cancel timer'
  },
  hi: {
    tag:'वॉइस असिस्टेंट', now:'अभी', 'try':'ये बोलकर देखो', timers:'टाइमर', notes:'नोट्स', convo:'बातचीत',
    idle:'ऑर्ब दबाओ और बोलो', listening:'सुन रहा हूँ…', thinking:'सोच रहा हूँ…', speaking:'बोल रहा हूँ…',
    placeholder:'या कमांड टाइप करो', send:'भेजो',
    noTimers:'कोई टाइमर नहीं चल रहा। बोलो “2 मिनट का टाइमर”.',
    noNotes:'अभी कोई नोट नहीं। बोलो “नोट करो दूध लाना”.',
    noLog:'यहाँ Nova से बातचीत दिखेगी।',
    unsupported:'यह ब्राउज़र सुन नहीं सकता। Chrome इस्तेमाल करो, या नीचे टाइप करो।',
    blocked:'माइक्रोफोन बंद है। ब्राउज़र की साइट सेटिंग में अनुमति दो।',
    nospeech:'कुछ सुनाई नहीं दिया। ऑर्ब दबाकर फिर कोशिश करो।',
    soundOn:'आवाज़: चालू', soundOff:'आवाज़: बंद',
    themeAuto:'थीम: ऑटो', themeLight:'थीम: लाइट', themeDark:'थीम: डार्क',
    remove:'हटाओ', cancel:'टाइमर रद्द करो'
  }
};
function s(key){ return UI[lang][key]; }

var CHIPS = {
  en: ['What time is it?', 'Tell me a joke', 'Timer 1 minute', 'Calculate 24 times 7', 'Note buy milk', 'Show notes', 'Search black holes'],
  hi: ['समय क्या हुआ?', 'जोक सुनाओ', '1 मिनट का टाइमर', '24 गुणा 7', 'नोट करो दूध लाना', 'नोट्स दिखाओ', 'सर्च करो ब्लैक होल']
};

/* ---------- theme ---------- */
function applyTheme(){
  var r = document.documentElement;
  if(themeSetting === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', themeSetting);
  var key = themeSetting === 'light' ? 'themeLight' : themeSetting === 'dark' ? 'themeDark' : 'themeAuto';
  $('#themeBtn').textContent = s(key);
}
$('#themeBtn').addEventListener('click', function(){
  themeSetting = themeSetting === 'auto' ? 'light' : themeSetting === 'light' ? 'dark' : 'auto';
  store.set('nova:theme', themeSetting);
  applyTheme();
});

/* ---------- sound toggle ---------- */
function applySound(){
  var b = $('#soundBtn');
  b.textContent = soundOn ? s('soundOn') : s('soundOff');
  b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
$('#soundBtn').addEventListener('click', function(){
  soundOn = !soundOn;
  store.set('nova:sound', soundOn);
  if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  applySound();
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang === 'hi' ? 'hi' : 'en';
  $('#langEn').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  $('#langHi').setAttribute('aria-pressed', lang === 'hi' ? 'true' : 'false');
  document.querySelectorAll('[data-i]').forEach(function(n){ n.textContent = s(n.getAttribute('data-i')); });
  $('#typeInput').setAttribute('placeholder', s('placeholder'));
  $('#sendBtn').textContent = s('send');
  renderChips(); renderTimers(); renderNotes(); renderLog(); applyTheme(); applySound(); setState(state);
  tickClock();
}
$('#langEn').addEventListener('click', function(){ lang = 'en'; store.set('nova:lang', lang); applyLang(); });
$('#langHi').addEventListener('click', function(){ lang = 'hi'; store.set('nova:lang', lang); applyLang(); });

/* ---------- status ---------- */
function setState(st){
  state = st;
  $('#status').textContent = s(st);
}
function liveText(txt){ $('#live').textContent = txt || ''; }

/* ---------- clock ---------- */
function tickClock(){
  var now = new Date();
  var loc = lang === 'hi' ? 'hi-IN' : 'en-IN';
  $('#clockTime').textContent = now.toLocaleTimeString(loc, {hour:'numeric', minute:'2-digit', second:'2-digit'});
  $('#clockDate').textContent = now.toLocaleDateString(loc, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
setInterval(tickClock, 1000);

/* ---------- rendering ---------- */
function renderChips(){
  var box = $('#chips'); box.textContent = '';
  CHIPS[lang].forEach(function(c){
    var b = el('button', {type:'button', text:c});
    b.addEventListener('click', function(){ run(c); });
    box.appendChild(b);
  });
}
function fmtClock(ms){
  var sec = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), r = sec % 60;
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  return (h ? h + ':' + pad(m) : m) + ':' + pad(r);
}
function renderTimers(){
  var ul = $('#timerList'); ul.textContent = '';
  if(!timers.length){ ul.appendChild(el('li', {'class':'empty', text:s('noTimers')})); return; }
  timers.forEach(function(tm){
    var cnt = el('span', {'class':'cnt', 'data-timer':tm.id, text:fmtClock(tm.end - Date.now())});
    var x = el('button', {type:'button', 'aria-label':s('cancel'), text:'×'});
    x.addEventListener('click', function(){ cancelTimer(tm.id); });
    ul.appendChild(el('li', {'class':'row'}, [el('span', {text:tm.label}), cnt, x]));
  });
}
function renderNotes(){
  var ul = $('#noteList'); ul.textContent = '';
  if(!notes.length){ ul.appendChild(el('li', {'class':'empty', text:s('noNotes')})); return; }
  notes.forEach(function(n, i){
    var x = el('button', {type:'button', 'aria-label':s('remove'), text:'×'});
    x.addEventListener('click', function(){ notes.splice(i, 1); store.set('nova:notes', notes); renderNotes(); });
    ul.appendChild(el('li', {'class':'row'}, [el('span', {text:n}), x]));
  });
}
function renderLog(){
  var box = $('#log'); box.textContent = '';
  if(!logItems.length){ box.appendChild(el('p', {'class':'empty', text:s('noLog')})); return; }
  logItems.forEach(function(m){
    var d = el('div', {'class':'msg ' + m.who, text:m.text});
    if(m.link){ d.appendChild(el('a', {href:m.link, target:'_blank', rel:'noopener noreferrer', text:m.linkLabel || m.link})); }
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}
function addLog(who, text, link, linkLabel){
  logItems.push({who:who, text:text, link:link, linkLabel:linkLabel});
  if(logItems.length > 40) logItems.shift();
  renderLog();
}

/* ---------- timers ---------- */
function beep(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    var ctx = new AC();
    [0, 0.35, 0.7].forEach(function(off){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + off);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + off + 0.25);
      o.start(ctx.currentTime + off); o.stop(ctx.currentTime + off + 0.3);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
}
function cancelTimer(id){
  timers = timers.filter(function(x){ return x.id !== id; });
  renderTimers();
}
setInterval(function(){
  var now = Date.now(), finished = [];
  timers.forEach(function(tm){
    var node = document.querySelector('[data-timer="' + tm.id + '"]');
    if(node) node.textContent = fmtClock(tm.end - now);
    if(tm.end <= now) finished.push(tm);
  });
  if(finished.length){
    timers = timers.filter(function(x){ return finished.indexOf(x) === -1; });
    renderTimers();
    finished.forEach(function(tm){
      var msg = t('Your ' + tm.label + ' timer is done.', 'आपका ' + tm.label + ' का टाइमर पूरा हुआ।');
      beep();
      addLog('nova', msg);
      speak(msg);
    });
  }
}, 500);

function durationLabel(secs){
  var n;
  if(secs % 3600 === 0){ n = secs / 3600; return t(n + (n === 1 ? ' hour' : ' hours'), n + ' घंटे'); }
  if(secs % 60 === 0){ n = secs / 60; return t(n + (n === 1 ? ' minute' : ' minutes'), n + ' मिनट'); }
  return t(secs + (secs === 1 ? ' second' : ' seconds'), secs + ' सेकंड');
}

/* ---------- calculator ---------- */
function calculate(q){
  var m = q.match(/(\d+(?:\.\d+)?)\s*(?:percent|%|प्रतिशत)\s*(?:of|का|की)?\s*(\d+(?:\.\d+)?)/);
  if(m){ return round(parseFloat(m[1]) * parseFloat(m[2]) / 100); }
  var e = q
    .replace(/multiplied by|गुणा|\btimes\b|\binto\b|\bx\b|×/g, '*')
    .replace(/divided by|\bover\b|÷|भाग/g, '/')
    .replace(/\bplus\b|\badd\b|जमा|जोड़/g, '+')
    .replace(/\bminus\b|\bsubtract\b|घटा/g, '-');
  var found = e.match(/[\d.()]+(?:\s*[-+*\/]\s*[\d.()]+)+/);
  if(!found) return null;
  var expr = found[0];
  if(!/^[\d\s+\-*\/().]+$/.test(expr)) return null;
  try{
    var v = Function('"use strict";return (' + expr + ')')();
    if(typeof v !== 'number' || !isFinite(v)) return null;
    return round(v);
  }catch(err){ return null; }
}
function round(n){ return Math.round(n * 1e6) / 1e6; }

/* ---------- brain ---------- */
function any(q, words){
  return words.some(function(w){
    if(/^[a-z' ]+$/.test(w)) return new RegExp('(^|[^a-z])' + w + '([^a-z]|$)').test(q);
    return q.indexOf(w) !== -1;
  });
}
var JOKES = [
  ['Why do programmers prefer dark mode? Because light attracts bugs.', 'प्रोग्रामर डार्क मोड क्यों पसंद करते हैं? क्योंकि रोशनी से बग आते हैं।'],
  ['Why was the computer cold? It left its Windows open.', 'कंप्यूटर को ठंड क्यों लग रही थी? क्योंकि उसकी विंडो खुली रह गई थी।'],
  ['There are 10 kinds of people: those who understand binary and those who don’t.', 'दुनिया में 10 तरह के लोग हैं: एक जो बाइनरी समझते हैं, और दूसरे जो नहीं समझते।'],
  ['My phone said: don’t go far from the charger, or I will switch off.', 'मोबाइल बोला: चार्जर से दूर मत जाना, वरना मैं बंद हो जाऊँगा।']
];
function searchLink(query, yt){
  return (yt ? 'https://www.youtube.com/results?search_query=' : 'https://www.google.com/search?q=') + encodeURIComponent(query);
}
function respond(raw){
  var q = raw.toLowerCase().trim()
    .replace(/^(hey |hi |ok |okay )?nova[,.!]?\s*/, '')
    .replace(/^(हे |हेय )?नोवा[,.!]?\s*/, '');
  var m, now = new Date();

  /* timer */
  if(any(q, ['timer', 'टाइमर', 'remind', 'reminder', 'रिमाइंडर', 'alarm'])){
    m = q.match(/(\d+(?:\.\d+)?)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?|सेकंड|सेकण्ड|मिनट|घंटे|घंटा)/);
    if(m){
      var mult = /sec|सेक/.test(m[2]) ? 1 : /min|मिन/.test(m[2]) ? 60 : 3600;
      var secs = Math.round(parseFloat(m[1]) * mult);
      if(secs > 0 && secs <= 86400){
        var label = durationLabel(secs);
        timers.push({id:++timerSeq, label:label, end:Date.now() + secs * 1000});
        renderTimers();
        return {text: t('Timer set for ' + label + '.', label + ' का टाइमर सेट हो गया।')};
      }
    }
    return {text: t('Tell me how long, like “timer 5 minutes”.', 'कितनी देर का? जैसे “5 मिनट का टाइमर”.')};
  }

  /* notes */
  if(any(q, ['clear notes', 'delete notes', 'notes delete', 'notes clear', 'नोट्स हटाओ', 'नोट्स मिटाओ'])){
    notes = []; store.set('nova:notes', notes); renderNotes();
    return {text: t('All notes cleared.', 'सारे नोट्स हटा दिए।')};
  }
  if(any(q, ['show notes', 'my notes', 'read notes', 'list notes', 'notes dikhao', 'notes dikha', 'नोट्स दिखाओ', 'मेरे नोट'])){
    if(!notes.length) return {text: t('You have no notes yet.', 'अभी कोई नोट नहीं है।')};
    var list = notes.map(function(n, i){ return (i + 1) + ', ' + n; }).join('. ');
    return {text: t('You have ' + notes.length + (notes.length === 1 ? ' note. ' : ' notes. ') + list + '.', 'आपके ' + notes.length + ' नोट हैं। ' + list + '।')};
  }
  m = q.match(/^(?:take a note|make a note|note down|note karo|note kar do|note kar|note|remember that|remember|नोट करो|नोट कर|नोट|याद रखो)[:,\s]+(.+)/);
  if(m){
    var txt = m[1].trim();
    notes.push(txt); store.set('nova:notes', notes); renderNotes();
    return {text: t('Saved: ' + txt + '.', 'सेव हो गया: ' + txt + '।')};
  }

  /* search */
  m = q.match(/^(search(?: for)?|google|look up|youtube|सर्च(?: करो)?|खोजो|यूट्यूब)\s+(.+)/);
  if(m){
    var yt = /youtube|यूट्यूब/.test(m[1]);
    var term = m[2].replace(/^(for|करो)\s+/, '').trim();
    return {text: t('Here is a search for ' + term + '.', term + ' के लिए सर्च लिंक यह रहा।'),
            link: searchLink(term, yt), linkLabel: t('Open results', 'नतीजे खोलो')};
  }

  /* calculator */
  if(/\d/.test(q)){
    var val = calculate(q);
    if(val !== null) return {text: t('The answer is ' + val + '.', 'जवाब है ' + val + '।')};
  }

  /* time & date */
  if(any(q, ['time', 'samay', 'kitne baje', 'what time', 'समय', 'टाइम', 'बजे'])){
    var tm = now.toLocaleTimeString(lang === 'hi' ? 'hi-IN' : 'en-IN', {hour:'numeric', minute:'2-digit'});
    return {text: t('It is ' + tm + '.', 'अभी ' + tm + ' हुए हैं।')};
  }
  if(any(q, ['date', 'tarikh', 'what day', 'today', 'din kaun sa', 'तारीख', 'डेट', 'आज', 'दिन'])){
    var dt = now.toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    return {text: t('Today is ' + dt + '.', 'आज ' + dt + ' है।')};
  }

  /* fun & small talk */
  if(any(q, ['joke', 'mazak', 'chutkula', 'funny', 'जोक', 'चुटकुला', 'मज़ाक', 'मजाक'])){
    var j = JOKES[Math.floor(Math.random() * JOKES.length)];
    return {text: t(j[0], j[1])};
  }
  if(any(q, ['your name', 'who are you', 'tumhara naam', 'tera naam', 'aap kaun', 'kaun ho', 'तुम्हारा नाम', 'तेरा नाम', 'कौन हो'])){
    return {text: t('I am Nova, a voice assistant. Ask me the time, notes, timers, a calculation, or a search.',
                    'मैं Nova हूँ, एक वॉइस असिस्टेंट। मुझसे समय, नोट्स, टाइमर, हिसाब या सर्च के लिए कहो।')};
  }
  if(any(q, ['hello', 'hi', 'hey', 'namaste', 'namaskar', 'good morning', 'good afternoon', 'good evening', 'नमस्ते', 'हेलो', 'हाय', 'हैलो'])){
    var h = now.getHours();
    var part = h < 12 ? ['Good morning', 'सुप्रभात'] : h < 17 ? ['Good afternoon', 'नमस्ते'] : ['Good evening', 'शुभ संध्या'];
    return {text: t(part[0] + '! How can I help?', part[1] + '! मैं कैसे मदद करूँ?')};
  }
  if(any(q, ['thanks', 'thank you', 'shukriya', 'dhanyavad', 'धन्यवाद', 'शुक्रिया', 'थैंक'])){
    return {text: t('You are welcome.', 'आपका स्वागत है।')};
  }
  if(any(q, ['bye', 'goodbye', 'alvida', 'see you', 'अलविदा', 'बाय'])){
    return {text: t('Goodbye! Talk soon.', 'अलविदा! फिर मिलेंगे।')};
  }
  if(any(q, ['help', 'what can you do', 'madad', 'kya kar sakte', 'मदद', 'हेल्प'])){
    return {text: t('I can tell the time and date, set timers, do calculations, save notes, tell jokes, and make search links.',
                    'मैं समय और तारीख बता सकता हूँ, टाइमर लगा सकता हूँ, हिसाब कर सकता हूँ, नोट्स सेव कर सकता हूँ, जोक सुना सकता हूँ और सर्च लिंक बना सकता हूँ।')};
  }

  /* fallback */
  return {text: t('I can’t answer that yet. Here is a search for it.', 'इसका जवाब मुझे अभी नहीं पता। इसके लिए सर्च लिंक यह रहा।'),
          link: searchLink(raw), linkLabel: t('Open results', 'नतीजे खोलो')};
}

/* ---------- speech out ---------- */
var voices = [];
function loadVoices(){ if('speechSynthesis' in window) voices = speechSynthesis.getVoices() || []; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(target){
  var tl = target.toLowerCase(), base = tl.slice(0, 2);
  var norm = function(v){ return (v.lang || '').replace('_', '-').toLowerCase(); };
  return voices.filter(function(v){ return norm(v).indexOf(tl) === 0; })[0] ||
         voices.filter(function(v){ return norm(v).indexOf(base) === 0; })[0] || null;
}
function speak(text){
  if(!soundOn || !('speechSynthesis' in window)){ setState('idle'); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var target = lang === 'hi' ? 'hi-IN' : 'en-IN';
    u.lang = target;
    var v = pickVoice(target);
    if(v) u.voice = v;
    u.onstart = function(){ setState('speaking'); };
    u.onend = function(){ setState('idle'); };
    u.onerror = function(){ setState('idle'); };
    speechSynthesis.speak(u);
    setState('speaking');
  }catch(e){ setState('idle'); }
}

/* ---------- speech in ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;
function startListen(){
  if(!SR){ liveText(s('unsupported')); return; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var finalText = '', failed = false;
  try{
    rec = new SR();
    rec.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onstart = function(){ listening = true; setState('listening'); liveText(''); };
    rec.onresult = function(e){
      var interim = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        var r = e.results[i];
        if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      liveText(finalText + interim);
    };
    rec.onerror = function(e){
      failed = true;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed') liveText(s('blocked'));
      else if(e.error === 'no-speech') liveText(s('nospeech'));
    };
    rec.onend = function(){
      listening = false;
      if(finalText.trim()) run(finalText.trim());
      else { setState('idle'); if(!failed) liveText(s('nospeech')); }
    };
    rec.start();
  }catch(e){ listening = false; setState('idle'); }
}
function stopListen(){ if(rec){ try{ rec.stop(); }catch(e){} } }
$('#orbBtn').addEventListener('click', function(){ if(listening) stopListen(); else startListen(); });

/* ---------- run a command ---------- */
function run(text){
  liveText(text);
  addLog('you', text);
  setState('thinking');
  setTimeout(function(){
    var r = respond(text);
    addLog('nova', r.text, r.link, r.linkLabel);
    speak(r.text);
  }, 300);
}
$('#typeForm').addEventListener('submit', function(e){
  e.preventDefault();
  var inp = $('#typeInput'), v = inp.value.trim();
  if(!v) return;
  inp.value = '';
  run(v);
});

/* ---------- orb ---------- */
var cv = $('#orb'), ctx = cv.getContext('2d');
var W = 0, dpr = 1;
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){
  var r = cv.getBoundingClientRect();
  if(!r.width) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width;
  cv.width = cv.height = Math.round(W * dpr);
}
window.addEventListener('resize', resize);
function hexA(hex, a){
  var h = hex.replace('#', '');
  if(h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
  var n = parseInt(h, 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function orbColors(){
  var cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue('--o1').trim() || '#3fc8b0', cs.getPropertyValue('--o2').trim() || '#6a5be0', cs.getPropertyValue('--o3').trim() || '#ff8f66'];
}
var amp = 0.04, spin = 0.35, phase = 0, last = 0;
var GOALS = {idle:[0.04, 0.35], listening:[0.10, 0.9], thinking:[0.07, 2.4], speaking:[0.16, 1.4]};
function drawOrb(a, p, tt){
  if(!W) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, W);
  var cx = W / 2, cy = W / 2, base = W * 0.27, cols = orbColors();
  var g = ctx.createRadialGradient(cx, cy, base * 0.5, cx, cy, W * 0.5);
  g.addColorStop(0, hexA(cols[1], 0.35));
  g.addColorStop(1, hexA(cols[1], 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
  for(var i = 0; i < 3; i++){
    ctx.beginPath();
    var ph = i * 2.1, n = 3 + i;
    for(var k = 0; k <= 96; k++){
      var th = k / 96 * Math.PI * 2;
      var r = base * (1 + i * 0.05 + a * (Math.sin(th * n + p + ph) + 0.6 * Math.sin(th * (n + 2) - p * 1.3 + ph * 2)));
      var x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r;
      if(k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = hexA(cols[i], 0.55);
    ctx.fill();
  }
}
function frame(ts){
  var dt = last ? Math.min((ts - last) / 1000, 0.1) : 0.016;
  last = ts;
  var tt = ts / 1000, goal = GOALS[state] || GOALS.idle;
  var ta = goal[0], tsp = goal[1];
  if(reduce){ ta *= 0.4; tsp *= 0.3; }
  amp += (ta - amp) * 0.06;
  spin += (tsp - spin) * 0.06;
  phase += dt * spin;
  var pulse = state === 'speaking' ? (0.6 + 0.4 * Math.sin(tt * 9) * Math.sin(tt * 5.3))
            : state === 'listening' ? (0.8 + 0.2 * Math.sin(tt * 3)) : 1;
  drawOrb(amp * pulse, phase, tt);
  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
resize();
applyLang();
if(!SR) liveText(s('unsupported'));
requestAnimationFrame(frame);
window.addEventListener('load', resize);
})();
</script>
